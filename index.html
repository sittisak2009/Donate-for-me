<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สนับสนุนสตรีมเมอร์</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
    .card { background: #1e293b; padding: 24px; border-radius: 16px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h2 { margin-top: 0; color: #f43f5e; }
    input, textarea, button { width: 100%; margin-bottom: 12px; padding: 12px; box-sizing: border-box; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; }
    button { background: #f43f5e; color: white; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; }
    button:hover { background: #e11d48; }
    #qr-img { width: 220px; display: none; margin: 15px auto; border-radius: 8px; background: #fff; padding: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>💖 โดเนทขึ้นจอ</h2>
    <input type="text" id="name" placeholder="ชื่อของคุณ">
    <input type="number" id="amount" placeholder="จำนวนเงิน (บาท)" min="1">
    <textarea id="message" placeholder="ข้อความเชียร์..." rows="3"></textarea>
    <button onclick="createQR()">สแกนจ่ายด้วย พร้อมเพย์</button>
    
    <img id="qr-img" alt="PromptPay QR">
    <button id="confirm-btn" style="display:none; background: #22c55e;" onclick="sendDonation()">แจ้งโอนเงินขึ้นจอ!</button>
  </div>

  <script>
    async function createQR() {
      const amount = document.getElementById('amount').value;
      if (!amount) return alert('กรุณาใส่จำนวนเงินด้วยครับนาย');

      const res = await fetch('/api/generate-qr', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount })
      });
      const data = await res.json();
      if (data.success) {
        const qrImg = document.getElementById('qr-img');
        qrImg.src = data.qr;
        qrImg.style.display = 'block';
        document.getElementById('confirm-btn').style.display = 'block';
      }
    }

    async function sendDonation() {
      const donorName = document.getElementById('name').value;
      const amount = document.getElementById('amount').value;
      const message = document.getElementById('message').value;

      await fetch('/api/donate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ donorName, amount, message })
      });

      alert('ส่งโดเนทขึ้นจอเรียบร้อย!');
      location.reload();
    }
  </script>
</body>
</html>
