<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <style>
    body { margin: 0; padding: 0; background: transparent; overflow: hidden; font-family: sans-serif; }
    #alert-card {
      display: none;
      position: absolute;
      top: 40px; left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 3px solid #f43f5e;
      border-radius: 20px;
      padding: 24px 48px;
      color: white;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .highlight { color: #f43f5e; font-size: 1.8em; font-weight: bold; }
    .msg { margin-top: 12px; font-size: 1.3em; color: #e2e8f0; word-break: break-word; }
    @keyframes pop {
      0% { transform: translate(-50%, -50px) scale(0.5); opacity: 0; }
      100% { transform: translate(-50%, 0) scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="alert-card">
    <div><span class="highlight" id="donor"></span> โดเนท <span class="highlight" id="amount"></span> บาท!</div>
    <div class="msg" id="message"></div>
  </div>

  <script>
    const socket = io();
    const alertCard = document.getElementById('alert-card');

    socket.on('new-donation', (data) => {
      document.getElementById('donor').innerText = data.donorName;
      document.getElementById('amount').innerText = data.amount;
      document.getElementById('message').innerText = data.message;

      alertCard.style.display = 'block';

      // อ่านเสียง Text-To-Speech ภาษาไทย
      if ('speechSynthesis' in window) {
        const text = `${data.donorName} โดเนท ${data.amount} บาท ข้อความคือ ${data.message}`;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'th-TH';
        utterance.rate = 1;
        window.speechSynthesis.speak(utterance);
      }

      // แสดงผลไว้ 7 วินาทีแล้วซ่อน
      setTimeout(() => {
        alertCard.style.display = 'none';
      }, 7000);
    });
  </script>
</body>
</html>
